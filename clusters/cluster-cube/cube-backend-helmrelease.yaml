# =============================================================================
# FLUX HELM RELEASE - cube-backend
# =============================================================================
# Ce fichier indique à Flux de déployer le chart Helm cube-backend.
# Flux surveille le repo Git et redéploie automatiquement quand :
# - Le chart Helm change (templates, Chart.yaml)
# - Les values.yaml changent (y compris le tag d'image mis à jour par l'automation)
#
# LIEN AVEC L'IMAGE AUTOMATION:
# Quand ImageUpdateAutomation commit un nouveau tag dans values.yaml,
# Flux détecte le changement Git et déclenche un redéploiement via ce HelmRelease.
# =============================================================================

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cube-backend
  namespace: flux-system
spec:
  chart:
    spec:
      # Chemin vers le chart Helm dans le repo Git
      chart: ./clusters/cluster-cube/cube-backend
      # IMPORTANT: "Revision" redéploie à chaque nouveau commit Git
      # Cela inclut les changements de values.yaml par l'ImageUpdateAutomation
      reconcileStrategy: Revision
      # Référence au GitRepository flux-infra (où sont les charts Helm)
      sourceRef:
        kind: GitRepository
        name: flux-system
  # Fréquence de réconciliation (vérifie si l'état désiré = état actuel)
  interval: 5m0s
  # Namespace où stocker les secrets Helm
  storageNamespace: default
  # Namespace cible pour les ressources Kubernetes déployées
  targetNamespace: default
