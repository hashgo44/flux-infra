# =============================================================================
# FLUX HELM RELEASE - cube-backend
# =============================================================================
# Ce fichier indique à Flux de déployer le chart Helm cube-backend.
# Flux surveille le repo Git et redéploie automatiquement quand :
# - Le chart Helm change (templates, Chart.yaml)
# - Les values.yaml changent (y compris le tag d'image mis à jour par l'automation)
# =============================================================================

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cube-backend
  namespace: flux-system
spec:
  chart:
    spec:
      # Chemin vers le chart Helm dans flux-infra
      chart: ./clusters/cluster-cube/cube-backend
      # Revision: redéploie à chaque changement Git détecté
      reconcileStrategy: Revision
      # Référence au GitRepository flux-infra
      sourceRef:
        kind: GitRepository
        name: flux-system
  # Fréquence de réconciliation
  interval: 5m0s
  # Namespace où stocker les secrets Helm
  storageNamespace: default
  # Namespace cible pour les ressources Kubernetes déployées
  targetNamespace: default
