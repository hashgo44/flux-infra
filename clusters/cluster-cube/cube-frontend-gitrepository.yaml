# =============================================================================
# GIT REPOSITORY - cube-frontend
# =============================================================================
# GitRepository dédié pour cube-frontend.
# Pointe vers le repo Git séparé contenant le code ET le chart Helm.
# Permet une isolation complète des déploiements.
# =============================================================================

---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: cube-frontend
  namespace: flux-system
spec:
  interval: 1m0s
  ref:
    branch: main
  secretRef:
    name: flux-system
  url: ssh://git@github.com/hashgo44/cube-frontend.git

