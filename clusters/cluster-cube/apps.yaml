# =============================================================================
# APPS - Flux Kustomization pour les applications
# =============================================================================
# Gère le déploiement des applications pour ce cluster.
# Dépend de "sources" pour avoir les GitRepositories disponibles.
# =============================================================================

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 10m0s
  dependsOn:
    - name: sources
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/production
  prune: true
  wait: true
