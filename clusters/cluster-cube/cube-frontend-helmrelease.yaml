---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cube-frontend
  namespace: flux-system
spec:
  chart:
    spec:
      # Chemin vers le chart Helm dans le repo cube-frontend
      chart: ./helm
      # Revision: redéploie à chaque changement Git dans le repo cube-frontend
      # Isolation complète : seuls les commits dans cube-frontend déclenchent ce HelmRelease
      reconcileStrategy: Revision
      # Référence au GitRepository SÉPARÉ de cube-frontend
      sourceRef:
        kind: GitRepository
        name: cube-frontend
  interval: 5m0s
  storageNamespace: default
  targetNamespace: default
