# =============================================================================
# FLUX IMAGE AUTOMATION - cube-backend
# =============================================================================
# Ce fichier configure l'automatisation des mises à jour d'images Docker.
# Flux surveille le registry, détecte les nouvelles images, et met à jour
# automatiquement le fichier values.yaml avec le nouveau tag.
#
# FLUX DE TRAVAIL:
# 1. ImageRepository → Surveille GHCR pour les nouvelles images
# 2. ImagePolicy     → Filtre et sélectionne la meilleure image (la plus récente)
# 3. ImageUpdateAutomation → Commit automatique du nouveau tag dans Git
# 4. HelmRelease (autre fichier) → Détecte le commit et redéploie
# =============================================================================

---
# =============================================================================
# ImageRepository - SURVEILLANCE DU REGISTRY
# =============================================================================
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImageRepository
metadata:
  name: cube-backend
  namespace: flux-system
spec:
  image: ghcr.io/hashgo44/cube-backend
  interval: 1m

---
# =============================================================================
# ImagePolicy - SÉLECTION DE L'IMAGE
# =============================================================================
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImagePolicy
metadata:
  name: cube-backend
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: cube-backend
  filterTags:
    # Pattern: main-<commit-sha>-<timestamp>
    pattern: '^main-[a-zA-Z0-9]+-(?P<ts>.*)$'
    extract: '$ts'
  policy:
    numerical:
      order: asc

---
# =============================================================================
# ImageUpdateAutomation - MISE À JOUR AUTOMATIQUE DU GIT
# =============================================================================
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImageUpdateAutomation
metadata:
  name: cube-backend
  namespace: flux-system
spec:
  interval: 1m
  # Référence au GitRepository flux-infra
  sourceRef:
    kind: GitRepository
    name: flux-system
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        name: fluxcdbot
        email: fluxcdbot@users.noreply.github.com
      messageTemplate: |
        chore(flux): update cube-backend to {{range .Changed.Changes}}{{println .NewValue}}{{end}}
    push:
      branch: main
  update:
    # Chemin vers le chart cube-backend dans flux-infra
    path: ./clusters/cluster-cube/cube-backend
    strategy: Setters
