# =============================================================================
# FLUX IMAGE AUTOMATION - cube-backend
# =============================================================================
# Ce fichier configure l'automatisation des mises à jour d'images Docker.
# Flux surveille le registry, détecte les nouvelles images, et met à jour
# automatiquement le fichier values.yaml avec le nouveau tag.
#
# FLUX DE TRAVAIL:
# 1. ImageRepository → Surveille GHCR pour les nouvelles images
# 2. ImagePolicy     → Filtre et sélectionne la meilleure image (la plus récente)
# 3. ImageUpdateAutomation → Commit automatique du nouveau tag dans Git
# 4. HelmRelease (autre fichier) → Détecte le commit et redéploie
# =============================================================================

---
# =============================================================================
# ImageRepository - SURVEILLANCE DU REGISTRY
# =============================================================================
# Interroge périodiquement le registry Docker (GHCR) pour lister tous les tags
# disponibles pour l'image spécifiée. Ces tags sont ensuite utilisés par
# l'ImagePolicy pour sélectionner la version à déployer.
# =============================================================================
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImageRepository
metadata:
  name: cube-backend
  namespace: flux-system
spec:
  # URL complète de l'image Docker (sans le tag)
  image: ghcr.io/hashgo44/cube-backend
  # Fréquence de vérification du registry
  # Plus l'intervalle est court, plus vite les nouvelles images sont détectées
  interval: 1m

---
# =============================================================================
# ImagePolicy - SÉLECTION DE L'IMAGE
# =============================================================================
# Définit les règles pour choisir quelle image déployer parmi toutes celles
# disponibles dans le registry. Utilise des regex pour filtrer et extraire
# des informations des tags (comme le timestamp).
# =============================================================================
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImagePolicy
metadata:
  name: cube-backend
  namespace: flux-system
spec:
  # Référence à l'ImageRepository qui fournit la liste des tags
  imageRepositoryRef:
    name: cube-backend
  # Filtrage des tags avec une expression régulière
  filterTags:
    # Pattern: main-<commit-sha>-<timestamp>
    # Exemple: main-a4f772f-1767552391
    pattern: '^main-[a-zA-Z0-9]+-(?P<ts>.*)$'
    # Extrait le timestamp pour le tri
    extract: '$ts'
  # Politique de sélection
  policy:
    # Tri numérique par timestamp (ascending = le plus grand = le plus récent)
    numerical:
      order: asc

---
# =============================================================================
# ImageUpdateAutomation - MISE À JOUR AUTOMATIQUE DU GIT
# =============================================================================
# Quand une nouvelle image est sélectionnée par l'ImagePolicy, ce composant
# met à jour automatiquement les fichiers YAML du repo Git avec le nouveau tag.
# Il cherche les marqueurs {"$imagepolicy": "..."} dans les fichiers.
#
# Commit directement dans le repo cube-backend (isolation complète)
# =============================================================================
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImageUpdateAutomation
metadata:
  name: cube-backend
  namespace: flux-system
spec:
  # Fréquence de vérification des mises à jour à appliquer
  interval: 1m
  # Référence au GitRepository SÉPARÉ de cube-backend
  sourceRef:
    kind: GitRepository
    name: cube-backend
  git:
    # Configuration du checkout
    checkout:
      ref:
        branch: main
    # Configuration du commit automatique
    commit:
      author:
        name: fluxcdbot
        email: fluxcdbot@users.noreply.github.com
      # Template du message de commit
      messageTemplate: |
        chore(flux): update image to {{range .Changed.Changes}}{{println .NewValue}}{{end}}
    # Push automatique sur la branche
    push:
      branch: main
  update:
    # Chemin vers le chart Helm dans le repo cube-backend
    path: ./helm
    # Stratégie "Setters" : cherche les marqueurs {"$imagepolicy": "..."}
    # dans les fichiers YAML et remplace la valeur adjacente
    strategy: Setters
