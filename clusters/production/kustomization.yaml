# =============================================================================
# KUSTOMIZATION - Point d'entrée Flux pour production
# =============================================================================
# Ce fichier liste les ressources de base que Flux doit appliquer.
#
# ARCHITECTURE:
# - flux-system/      → Controllers Flux
# - sources.yaml      → GitRepositories des applications
# - apps.yaml         → Déploiement des applications
# - infrastructure.yaml → Infrastructure (optionnel)
# =============================================================================

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Configuration Flux (controllers, GitRepository flux-system)
  - flux-system
  # Sources Git pour les applications (GitRepositories séparés)
  - sources.yaml
  # Déploiement des applications
  - apps.yaml
  # Infrastructure (commenté car vide)
  # - infrastructure.yaml
