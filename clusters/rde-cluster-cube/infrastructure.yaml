# =============================================================================
# INFRASTRUCTURE - Flux Kustomization pour l'infrastructure
# =============================================================================
# Gère les composants d'infrastructure partagés.
# Exemple: cert-manager, ingress-nginx, sealed-secrets, etc.
#
# Décommentez selon vos besoins.
# =============================================================================

apiVersion: kustomize.toolkit.fluxcd.io/v1beta2
kind: Kustomization
metadata:
  name: monitoring
  namespace: flux-system
spec:
  interval: 10m
  path: ./infrastructure/monitoring
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
