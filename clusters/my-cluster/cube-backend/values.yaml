# Default values for cube-backend.

name: cube-backend
namespace: default

replicaCount: 2

image:
  repository: ghcr.io/hashgo44/cube-backend
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 8000

container:
  port: 8000

env:
  # Le service PostgreSQL créé par Bitnami sera: <release-name>-postgresql
  # Dans notre cas: cube-backend-postgresql
  databaseUrl: "postgresql+psycopg://postgres:password@cube-backend-postgresql:5432/postgres"

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

# ---- PostgreSQL (Bitnami) ----
postgresql:
  enabled: true
  auth:
    postgresPassword: "password"
    database: "postgres"
  primary:
    persistence:
      enabled: true
      size: 10Gi
      storageClass: ""  # Utilise la StorageClass par défaut du cluster

# ---- Le reste du fichier ----

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
securityContext: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

httpRoute:
  enabled: false
  annotations: {}
  parentRefs:
  - name: gateway
    sectionName: http
  hostnames:
  - chart-example.local
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /headers

livenessProbe:
  httpGet:
    path: /
    port: http
readinessProbe:
  httpGet:
    path: /
    port: http

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

volumes: []
volumeMounts: []

nodeSelector: {}
tolerations: []
affinity: {}
