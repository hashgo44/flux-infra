---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cube-backend
  namespace: flux-system
spec:
  chart:
    spec:
      chart: ./clusters/my-cluster/cube-backend
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: GitRepository
        name: flux-system
  interval: 30m0s
  storageNamespace: default
  targetNamespace: default
