---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cube-backend
  namespace: flux-system
spec:
  chart:
    spec:
      chart: ./clusters/my-cluster/cube-backend
      reconcileStrategy: Revision  # Redéploie à chaque commit Git (values.yaml inclus)
      sourceRef:
        kind: GitRepository
        name: flux-system
  interval: 5m0s  # Vérifie plus souvent
  storageNamespace: default
  targetNamespace: default
