# =============================================================================
# HelmRelease - cube-backend (base)
# =============================================================================
# Configuration de base du HelmRelease.
# Les valeurs spécifiques à l'environnement sont dans apps/<env>/cube-backend/
# =============================================================================

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cube-backend
  namespace: flux-system
spec:
  chart:
    spec:
      chart: ./charts/cube-backend
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: flux-system
  interval: 5m0s
  storageNamespace: default
  targetNamespace: default

