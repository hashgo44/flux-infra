---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImageUpdateAutomation
metadata:
  name: cube-backend-preprod
  namespace: flux-system
spec:
  interval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system-development
  git:
    checkout:
      ref:
        branch: development
    commit:
      author:
        name: fluxcdbot
        email: fluxcdbot@users.noreply.github.com
      messageTemplate: |
        chore(flux): update cube-backend to {{range .Changed.Changes}}{{println .NewValue}}{{end}}
    push:
      branch: development
  update:
    path: ./apps/preprod/cube-backend
    strategy: Setters