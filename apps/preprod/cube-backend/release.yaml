# =============================================================================
# HelmRelease overlay - cube-backend pour preproduction
# =============================================================================
# Patch le HelmRelease de base avec les valeurs spécifiques à preprod
# =============================================================================

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cube-backend
  namespace: flux-system
spec:
  interval: 1m0s
  releaseName: cube-backend-preprod
  storageNamespace: preprod
  targetNamespace: preprod
  valuesFrom:
    - kind: ConfigMap
      name: cube-backend-values-preprod
      valuesKey: values.yaml
      optional: true