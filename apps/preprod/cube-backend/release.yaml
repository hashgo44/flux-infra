# =============================================================================
# HelmRelease - cube-backend pour preproduction
# =============================================================================
# HelmRelease complet pour l'environnement preprod
# =============================================================================

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cube-backend-preprod
  namespace: flux-system
spec:
  chart:
    spec:
      chart: ./charts/cube-backend
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: GitRepository
        name: flux-system
  interval: 5m0s
  storageNamespace: preprod
  targetNamespace: preprod
  valuesFrom:
    - kind: ConfigMap
      name: cube-backend-values
      valuesKey: values.yaml
      optional: true