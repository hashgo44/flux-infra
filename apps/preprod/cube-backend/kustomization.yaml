apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: flux-system
resources:
  - ../../base/cube-backend
  - namespace.yaml
  - image-repository.yaml
  - image-policy.yaml
  - image-update.yaml
patchesStrategicMerge:
  - release.yaml
patches:
  - target:
      kind: HelmRelease
      name: cube-backend
    patch: |-
      - op: replace
        path: /metadata/name
        value: cube-backend-preprod
configMapGenerator:
  - name: cube-backend-values-preprod
    files:
      - values.yaml
generatorOptions:
  disableNameSuffixHash: true