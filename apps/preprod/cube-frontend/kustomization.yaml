apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: flux-system
resources:
  - ../../base/cube-frontend
  - namespace.yaml
  - image-repository.yaml
  - image-policy.yaml
  - image-update.yaml
patchesStrategicMerge:
  - release.yaml
patches:
  - target:
      kind: HelmRelease
      name: cube-frontend
    patch: |-
      - op: replace
        path: /metadata/name
        value: cube-frontend-preprod
configMapGenerator:
  - name: cube-frontend-values-preprod
    files:
      - values.yaml
generatorOptions:
  disableNameSuffixHash: true
