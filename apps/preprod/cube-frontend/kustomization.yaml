apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: flux-system
resources:
  - namespace.yaml
  - image-repository.yaml
  - image-policy.yaml
  - image-update.yaml
  - release.yaml
configMapGenerator:
  - name: cube-frontend-values-preprod
    files:
      - values.yaml
generatorOptions:
  disableNameSuffixHash: true
