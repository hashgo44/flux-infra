# =============================================================================
# HelmRelease overlay - cube-frontend pour preproduction
# =============================================================================
# Patch le HelmRelease de base avec les valeurs spécifiques à preprod
# =============================================================================

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cube-frontend
  namespace: flux-system
spec:
  releaseName: cube-frontend-preprod
  storageNamespace: preprod
  targetNamespace: preprod
  valuesFrom:
    - kind: ConfigMap
      name: cube-frontend-values-preprod
      valuesKey: values.yaml
      optional: true
