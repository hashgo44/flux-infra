# =============================================================================
# HelmRelease overlay - cube-frontend pour production
# =============================================================================
# Patch le HelmRelease de base avec les valeurs spécifiques au cluster
# =============================================================================

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cube-frontend
  namespace: flux-system
spec:
  valuesFrom:
    - kind: ConfigMap
      name: cube-frontend-values-production
      valuesKey: values.yaml
      optional: true

