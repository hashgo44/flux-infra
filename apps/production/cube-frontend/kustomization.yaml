apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base/cube-frontend
  - image-repository.yaml
  - image-policy.yaml
  - image-update.yaml
patchesStrategicMerge:
  - release.yaml
configMapGenerator:
  - name: cube-frontend-values
    files:
      - values.yaml
generatorOptions:
  disableNameSuffixHash: true

