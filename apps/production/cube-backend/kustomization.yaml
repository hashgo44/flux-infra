apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: flux-system
resources:
  - ../../base/cube-backend
  - image-repository.yaml
  - image-policy.yaml
  - image-update.yaml
patchesStrategicMerge:
  - release.yaml
configMapGenerator:
  - name: cube-backend-values-production
    files:
      - values.yaml
generatorOptions:
  disableNameSuffixHash: true

