# =============================================================================
# HelmRelease overlay - cube-backend pour production
# =============================================================================
# Patch le HelmRelease de base avec les valeurs spécifiques au cluster
# =============================================================================

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cube-backend
  namespace: flux-system
spec:
  interval: 1m0s
  releaseName: cube-backend-prod
  storageNamespace: default
  targetNamespace: default
  valuesFrom:
    - kind: ConfigMap
      name: cube-backend-values-production
      valuesKey: values.yaml
      optional: true

