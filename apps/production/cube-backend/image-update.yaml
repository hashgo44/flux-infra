# =============================================================================
# ImageUpdateAutomation - cube-backend
# =============================================================================
# Commit automatique des nouveaux tags dans le repo Git
# =============================================================================

---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImageUpdateAutomation
metadata:
  name: cube-backend
  namespace: flux-system
spec:
  interval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        name: fluxcdbot
        email: fluxcdbot@users.noreply.github.com
      messageTemplate: |
        chore(flux): update cube-backend to {{range .Changed.Changes}}{{println .NewValue}}{{end}}
    push:
      branch: main
  update:
    path: ./apps/production/cube-backend
    strategy: Setters

